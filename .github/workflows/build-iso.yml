name: Build Debian 13 SecureBoot ISO for Lenovo 300e

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      debian_snapshot:
        description: 'Debian snapshot timestamp (YYYYMMDDTHHMMSSZ) or "live"'
        required: false
        default: '20261031T000000Z'
      run_boot_test:
        description: 'Boot-test the signed ISO under OVMF Secure Boot (QEMU). Push/tag runs always boot-test; this only opts out of manual runs.'
        required: false
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and Repack UEFI ISO
    runs-on: ubuntu-latest
    # Needed to publish the ISO as a GitHub Release for v* tags.
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Free Disk Space on Runner
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /usr/local/share/boost /usr/share/swift /opt/hostedtoolcache/CodeQL || true
          df -h /

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            sbsigntool \
            xorriso \
            dosfstools \
            mtools \
            zstd

          # ubuntu-latest only ships live-build 3.0~a57 (2013) and its
          # matching debootstrap, which predate trixie and reject current
          # options such as --updates. Install the Debian 13 packages so the
          # toolchain matches the suite being built.
          curl -fsSL -o /tmp/live-build.deb \
            https://deb.debian.org/debian/pool/main/l/live-build/live-build_20250505+deb13u1_all.deb
          curl -fsSL -o /tmp/debootstrap.deb \
            https://deb.debian.org/debian/pool/main/d/debootstrap/debootstrap_1.0.141_all.deb
          curl -fsSL -o /tmp/debian-archive-keyring.deb \
            https://deb.debian.org/debian/pool/main/d/debian-archive-keyring/debian-archive-keyring_2025.1_all.deb

          # Pin the build toolchain: these three .debs are installed as root.
          cat > /tmp/toolchain.sha256 <<'EOF'
          58e09779881cbcc631c49ceb703413e0247a87db01823e597b2a1c40a2afd8f4  live-build.deb
          8c02cb8ad712eb67afb0d23fab175c562804cc97eda70b70cb0f3bc2a21732d7  debootstrap.deb
          9ea7778e443144ca490668737a8ab22dd3e748bb99e805e22ec055abeb3c7fac  debian-archive-keyring.deb
          EOF
          (cd /tmp && sha256sum --check toolchain.sha256)

          sudo apt-get install -y /tmp/debian-archive-keyring.deb /tmp/debootstrap.deb /tmp/live-build.deb

          echo "live-build version on PATH:"
          lb --version

      - name: Ensure Executable Permissions on Project Scripts
        run: |
          chmod +x auto/clean auto/config auto/build
          chmod +x scripts/*.sh
          find config/ -type f -name "*.sh" -exec chmod +x {} +
          find config/hooks/ -type f -exec chmod +x {} +
          find config/includes.chroot/usr/local/bin/ config/includes.chroot/usr/local/sbin/ -type f -exec chmod +x {} + || true

      - name: Configure Live-Build for Debian amd64
        env:
          # The package lists use trixie-only t64 names; do not offer bookworm.
          DEBIAN_VERSION: trixie
          DEBIAN_SNAPSHOT: ${{ github.event.inputs.debian_snapshot || '20261031T000000Z' }}
        run: |
          echo "Configuring live-build for Debian suite: ${DEBIAN_VERSION}"
          echo "Build-time packages pinned to: ${DEBIAN_SNAPSHOT}"
          sudo lb clean --purge
          sudo DEBIAN_VERSION="${DEBIAN_VERSION}" DEBIAN_SNAPSHOT="${DEBIAN_SNAPSHOT}" lb config

      # Must run after lb clean --purge (which drops cache/) and before lb build.
      - name: Restore Live-Build Package Cache
        uses: actions/cache@v4
        with:
          # live-build stores downloaded .debs in cache/packages.<stage>
          path: |
            cache/packages.bootstrap
            cache/packages.chroot
          key: lb-apt-${{ runner.os }}-${{ hashFiles('auto/config', 'config/package-lists/**') }}
          restore-keys: |
            lb-apt-${{ runner.os }}-

      - name: Execute Live-Build Compilation
        run: |
          set -o pipefail
          echo "Starting Debian live-build compilation..."
          sudo lb build 2>&1 | tee live-build.log
          echo "Live-build compilation complete."

      - name: Upload Live-Build Log
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: live-build-log
          path: live-build.log
          if-no-files-found: ignore
          retention-days: 14

      - name: Repack UEFI Bootable ISO
        run: |
          ORIG_ISO=$(ls live-image-amd64*.iso 2>/dev/null | head -n 1)
          if [ -z "$ORIG_ISO" ] || [ ! -f "$ORIG_ISO" ]; then
            echo "ERROR: No output ISO found from live-build!"
            exit 1
          fi
          echo "Original generated ISO: ${ORIG_ISO}"
          FINAL_ISO="debian-live-lenovo300e-uefi.iso"

          # Repack the tree with a valid GPT + protective MBR. The kernel is
          # the Debian-signed image from linux-image; no MOK/sbsign step runs.
          # Run as the unprivileged runner user: repacking only needs read
          # access to the ISO, and root-owned outputs would break the checksum
          # and artifact upload.
          ./scripts/repack-iso.sh "$ORIG_ISO" "$FINAL_ISO"

          ls -lh "$FINAL_ISO"
          sha256sum "$FINAL_ISO" | tee "${FINAL_ISO}.sha256"

      - name: Verify UEFI Secure Boot ISO
        run: |
          chmod +x scripts/verify-iso.sh
          ./scripts/verify-iso.sh debian-live-lenovo300e-uefi.iso

      - name: Install Boot Test Dependencies
        # Push and tag runs always boot-test; manual runs can opt out.
        if: success() && (github.event_name != 'workflow_dispatch' || github.event.inputs.run_boot_test == 'true')
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            qemu-system-x86 \
            ovmf \
            socat \
            tesseract-ocr \
            tesseract-ocr-eng \
            netpbm

      # Boots the UEFI ISO under OVMF Secure Boot and waits for the live
      # system to reach userspace (login prompt on the serial console), so a
      # rejected kernel or a broken initramfs fails the build instead of just
      # showing a different screen.
      - name: Boot Test UEFI ISO under OVMF Secure Boot
        if: success() && (github.event_name != 'workflow_dispatch' || github.event.inputs.run_boot_test == 'true')
        env:
          # The target boots from a USB stick; exercise the GPT ESP path by default.
          BOOT_MEDIA: usb
        run: |
          chmod +x scripts/boot-test-iso.sh
          ./scripts/boot-test-iso.sh debian-live-lenovo300e-uefi.iso

      - name: Upload Boot Test Evidence
        if: always() && hashFiles('boot-test-artifacts/**') != ''
        uses: actions/upload-artifact@v5
        with:
          name: secureboot-boot-test
          path: boot-test-artifacts
          retention-days: 14

      # Run even when verification fails: the UEFI ISO costs a full
      # live-build run, so it must not be lost over a failed check. The
      # checksum is written only after repack-iso.sh finishes, which keeps a
      # half-written ISO from being published as final.
      - name: Upload Repacked SecureBoot ISO and Checksum
        if: always() && hashFiles('debian-live-lenovo300e-uefi.iso.sha256') != ''
        uses: actions/upload-artifact@v5
        with:
          name: debian-13-lenovo-300e-uefi-iso
          path: |
            debian-live-lenovo300e-uefi.iso
            debian-live-lenovo300e-uefi.iso.sha256
          retention-days: 14
          # The ISO is already compressed; recompressing it just burns CI time.
          compression-level: 0

      - name: Publish GitHub Release
        if: success() && startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          set -euo pipefail
          ISO="debian-live-lenovo300e-uefi.iso"
          FILES=("$ISO" "${ISO}.sha256")

          if [ -n "${GPG_PRIVATE_KEY:-}" ]; then
            printf '%s\n' "${GPG_PRIVATE_KEY}" | gpg --batch --import
            gpg --batch --yes --pinentry-mode loopback \
              --passphrase "${GPG_PASSPHRASE:-}" \
              --armor --detach-sign --output "${ISO}.asc" "$ISO"
            FILES+=("${ISO}.asc")
          else
            echo "GPG_PRIVATE_KEY is not configured; publishing without a detached signature."
          fi

          gh release create "${GITHUB_REF_NAME}" "${FILES[@]}" \
            --title "Debian 13 Lenovo 300e ${GITHUB_REF_NAME}" \
            --notes "ISO live de Debian 13 para Lenovo 300e (N4120), UEFI Secure Boot con firmas de Debian.

          Verifica la descarga con:
          \`\`\`
          sha256sum -c ${ISO}.sha256
          \`\`\`

          Arranca con Secure Boot activado sin enrolar ninguna clave."
