# Calamares settings for the Lenovo 300e live image.
# Based on calamares-settings-debian 13.0.13 (trixie). The only change is the
# shellprocess@efi-fallback job after the bootloader: it runs the installed
# system's efi-removable-fallback helper while the target ESP is still mounted,
# so EFI/BOOT contains shim (Microsoft-signed) instead of the Debian-signed
# GRUB copy that Calamares' installEFIFallback leaves there and that firmware
# rejects under Secure Boot.
---
modules-search: [ local, /usr/lib/x86_64-linux-gnu/calamares/modules, /usr/lib/calamares/modules ]

oem-setup: false
disable-cancel: false
disable-cancel-during-exec: false
quit-at-end: false

# Instances: the three shellprocess jobs below use explicit instance keys, so
# each one must declare its own configuration file here. Without this block
# Calamares would load shellprocess.conf for all of them and none of these
# commands would run.
instances:
- id: efi-fallback
  module: shellprocess
  config: efi-fallback.conf
- id: detect-intel-hardware
  module: shellprocess
  config: detect-intel-hardware.conf
- id: remove-installer-menu
  module: shellprocess
  config: remove-installer-menu.conf
- id: autologin
  module: shellprocess
  config: autologin.conf

sequence:
- show:
  - welcome
  - locale
  - keyboard
  - partition
  - users
  - summary

- exec:
  - partition
  - mount
  - unpackfs
  - luksbootkeyfile
  - dpkg-unsafe-io
  - sources-media
  - machineid
  - fstab
  - locale
  - keyboard
  - localecfg
  - users
  - shellprocess@autologin
  - displaymanager
  - networkcfg
  - hwclock
  - services-systemd
  - bootloader-config
  - grubcfg
  - bootloader
  - shellprocess@efi-fallback
  - packages
  - shellprocess@detect-intel-hardware
  - shellprocess@remove-installer-menu
  - plymouthcfg
  - initramfscfg
  - initramfs
  - dpkg-unsafe-io-undo
  - sources-media-unmount
  - sources-final
  - umount

- show:
  - finished

branding: debian
prompt-install: false
dont-chroot: false
