---
# Remove Calamares installer traces from the installed system.
# Runs at the end of the Calamares sequence. The users module has already
# created the account, so cleaning /etc/skel is not enough: every /home/*
# directory is cleaned as well.

dontChroot: false
script:
  - command: "sed -i '/Install MAXT_OS to Disk (Calamares)/,+4d' /etc/skel/.config/labwc/menu.xml || true"
  - command: "sed -i '/^    \"custom\\/installer\",$/d' /etc/skel/.config/waybar/config || true"
  - command: "sed -i '/^  \"custom\\/installer\": {/,/^  },/d' /etc/skel/.config/waybar/config || true"
  - command: "sed -i '/Instalar en disco/d' /etc/motd || true"
  - command: "for d in /home/*; do [ -d \"$d\" ] || continue; if [ -f \"$d/.config/labwc/menu.xml\" ]; then sed -i '/Install MAXT_OS to Disk (Calamares)/,+4d' \"$d/.config/labwc/menu.xml\" || true; fi; if [ -f \"$d/.config/waybar/config\" ]; then sed -i '/^    \"custom\\/installer\",$/d' \"$d/.config/waybar/config\" || true; sed -i '/^  \"custom\\/installer\": {/,/^  },/d' \"$d/.config/waybar/config\" || true; fi; done"
  - command: "rm -f /usr/local/bin/launch-calamares"
  - command: "rm -f /usr/share/applications/calamares.desktop /usr/share/applications/calamares-install-debian.desktop"
  - command: "/usr/local/bin/optimize-intel-hardware"
