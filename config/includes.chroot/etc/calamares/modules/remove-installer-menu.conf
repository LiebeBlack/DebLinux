---
# Remove Calamares installer menu entry from installed system
# This hook runs after package installation to clean up the live image
# specific menu items that should not appear in the installed system

dontChroot: false
script:
  - command: "sed -i '/Install Debian to Disk (Calamares)/,+4d' /etc/skel/.config/labwc/menu.xml"
  - command: "rm -f /usr/local/bin/launch-calamares"
  - command: "rm -f /usr/share/applications/calamares.desktop /usr/share/applications/calamares-install-debian.desktop"
  - command: "if [ -d /home/live ]; then sed -i '/Install Debian to Disk (Calamares)/,+4d' /home/live/.config/labwc/menu.xml 2>/dev/null || true; fi"
  - command: "/usr/local/bin/optimize-intel-hardware"


