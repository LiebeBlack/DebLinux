# Calamares 3.4 partitioning defaults for the Lenovo 300e.
#
# The live image ships GRUB for UEFI only (no BIOS bootloader), so the target
# installation must be a GPT disk with an EFI system partition. Calamares picks
# GPT by itself on EFI systems; pinning both keys makes that the explicit goal
# and refuses a legacy/MBR install that would not boot this image.
defaultPartitionTableType: gpt
requiredPartitionTableType: gpt
