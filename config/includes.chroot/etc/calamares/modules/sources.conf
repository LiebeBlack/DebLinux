---
# Calamares sources module configuration
# Configures package sources from official Debian mirrors
# Fully automated - no user intervention required

sourceDescriptionStep: false

sourcesList:
  - method: "url"
    url: "http://deb.debian.org/debian"
    distribution: "trixie"
    components:
      - main
      - contrib
      - non-free
      - non-free-firmware

  - method: "url"
    url: "http://security.debian.org/debian-security"
    distribution: "trixie-security"
    components:
      - main
      - contrib
      - non-free
      - non-free-firmware

  - method: "url"
    url: "http://deb.debian.org/debian"
    distribution: "trixie-updates"
    components:
      - main
      - contrib
      - non-free
      - non-free-firmware

skipSelection: true
generateSourcesList: true

