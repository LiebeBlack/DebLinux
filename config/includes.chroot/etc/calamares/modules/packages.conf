---
# Calamares packages module configuration
# Downloads essential packages from official Debian mirrors
# Fully automated - no user intervention required
# Optimized for Intel - ultralight and minimal

backend: apt
update_db: true
update_system: false

packages:
  # Intel Graphics - Essential Only
  - intel-media-va-driver
  - mesa-va-drivers
  - mesa-vulkan-drivers
  - firmware-intel-graphics
  - libva-wayland2
  - libva-drm2
  - vainfo

  # Intel Firmware - Essential Only
  - firmware-intel-sound
  - firmware-sof-signed
  - alsa-ucm-conf
  - firmware-iwlwifi
  - intel-microcode

  # Networking - Minimal
  - network-manager
  - wpasupplicant
  - bluetooth
  - bluez

  # Display & Input - Minimal
  - brightnessctl
  - libinput-bin
  - libinput-tools
  - xserver-xorg-input-libinput
  - xinput
  - x11-xserver-utils

  # Audio Control - Minimal
  - pavucontrol

  # System Tools - Minimal
  - powertop
  - thermald

  # Hardware Detection - Minimal
  - dmidecode
  - pciutils
  - usbutils

post_install_script: "/usr/local/bin/optimize-intel-hardware"

