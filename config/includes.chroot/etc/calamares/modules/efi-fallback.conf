# Calamares shellprocess instance: shellprocess@efi-fallback
#
# Calamares' installEFIFallback copies the Debian-signed GRUB to
# EFI/BOOT/BOOTX64.EFI. Firmware only trusts the Microsoft UEFI CA in that
# removable path, so Secure Boot rejects that copy. Run the same helper the
# installed system uses at boot while /boot/efi is still mounted, so EFI/BOOT
# ends up with:
#
#   BOOTX64.EFI  shim       (Microsoft UEFI CA signed)
#   grubx64.efi  GRUB       (Debian signed, trusted by shim)
#   grub.cfg     root UUID  (search + chainload /boot/grub/grub.cfg)
#
# The leading "-" makes a fallback failure non-fatal: the primary NVRAM entry
# (shim in EFI/<id>) still boots, and efi-removable-fallback.service retries
# on the first boot.
---
dontChroot: false
timeout: 120
verbose: true
script:
  - "-/usr/local/sbin/efi-removable-fallback"
