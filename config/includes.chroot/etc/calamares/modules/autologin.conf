---
# Calamares shellprocess instance: shellprocess@autologin
#
# The live image autologs into TTY1 as "live", but that account does not exist
# on the installed system. This job rewrites the drop-in with the user the
# installer just created, and disables autologin when no regular user exists.
dontChroot: false
script:
  - "/usr/local/sbin/setup-autologin"
