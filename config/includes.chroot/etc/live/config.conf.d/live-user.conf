# Debian Live Config Configuration for Lenovo 300e
#
# The live user password is NOT configured here: live-config has no
# LIVE_PASSWORD variable (components/0030-user-setup hardcodes the "live"
# password) and its user-setup component is skipped because the user already
# exists. config/hooks/live/0100-user-setup.hook.chroot creates the account
# and sets live/live and root/root with chpasswd.
LIVE_USERNAME="live"
LIVE_USER_FULLNAME="Live User"
LIVE_USER_DEFAULT_GROUPS="audio,video,input,render,_seat,seat,sudo,plugdev,netdev"
LIVE_CONFIG_NOCOMPONENTS="nodm,gdm,gdm3,kdm,lightdm,lxdm,sddm,slim,xdm"
